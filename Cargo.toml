[workspace]
resolver = "2"
members = [
    "crates/repin-core",
    "crates/repin-fs",
    "crates/repin-store-sqlite",
    "crates/repin-direct-search",
    "crates/repin-packs",
    "crates/repin-indexing",
    "crates/repin-retrieval",
    "crates/repin-context",
    "crates/repin-intelligence",
    "crates/repin-runtime",
    "crates/repin",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["Isa Al Ula <isaalula@proton.me>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/repin/repin"
readme = "README.md"

[workspace.dependencies]
# Internal workspace crates
repin-core = { path = "crates/repin-core", version = "0.1.1" }
repin-fs = { path = "crates/repin-fs", version = "0.1.1" }
repin-store-sqlite = { path = "crates/repin-store-sqlite", version = "0.1.1" }
repin-direct-search = { path = "crates/repin-direct-search", version = "0.1.1" }
repin-packs = { path = "crates/repin-packs", version = "0.1.1" }
repin-indexing = { path = "crates/repin-indexing", version = "0.1.1" }
repin-retrieval = { path = "crates/repin-retrieval", version = "0.1.1" }
repin-context = { path = "crates/repin-context", version = "0.1.1" }
repin-intelligence = { path = "crates/repin-intelligence", version = "0.1.1" }
repin-runtime = { path = "crates/repin-runtime", version = "0.1.1" }
repin = { path = "crates/repin", version = "0.1.1" }

# Serialization & encoding
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# Cryptography & hashing
blake3 = "1.5"
hex = "0.4"

# Networking & HTTP
ureq = { version = "2.10", features = ["json"] }

# Storage & SQLite
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "hooks"] }

# Filesystem & containment
cap-std = "3.4"
ignore = "0.4"
globset = "0.4"
fs4 = "0.12"
tempfile = "3.17"

# Text & Regex
regex = "1.11"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-md = "0.3"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"

notify = { version = "8.0", default-features = false, features = ["macos_kqueue"] }
# CLI & Diagnostics
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
anyhow = "1.0"

# Async & Concurrency (bounded workers)
crossbeam-channel = "0.5"
rayon = "1.10"

# Testing & Verification
proptest = "1.6"
insta = "1.42"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
