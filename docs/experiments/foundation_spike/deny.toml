[advisories]
# Q-007 owns temporary, exact exceptions; cargo-deny itself never ignores one.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
confidence-threshold = 0.80
include-dev = true
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
]

[licenses.private]
ignore = false

[sources]
# crates.io is the only registry. Git is denied by default; path dependencies
# are reserved for the explicitly isolated fixtures under fixtures/.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
