name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  test:
    name: Test & Lint Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Check code formatting
        run: just fmt

      - name: Run clippy
        run: just clippy

      - name: Run workspace test suite
        run: just test

      - name: Run documentation tests
        run: just doc-test

      - name: Verify release build
        run: just release

      - name: Verify Git-derived binary version
        shell: bash
        run: |
          package_version="$(
            cargo metadata --no-deps --format-version 1 | python3 -c "
          import json, sys
          pkgs = json.load(sys.stdin)['packages']
          name = 'repin'
          print(next(p['version'] for p in pkgs if p['name'] == name))
          "
          )"
          commit="$(git rev-parse --short=12 HEAD)"
          expected="repin v${package_version}-${commit}"
          release_bin="target/${CARGO_BUILD_TARGET}/release/repin"
          test "$("$release_bin" --version)" = "$expected"

  docs:
    name: Documentation Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Build and verify documentation
        run: just docs

  release:
    name: Build & Publish Release
    needs: [test, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build & package release
        run: just dist

      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          heading="## [${version}]"
          awk -v heading="$heading" '
            $0 == heading || index($0, heading " - ") == 1 {
              found = 1
              next
            }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Changelog section for ${version} is empty" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "repin-*.tar.gz"
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
