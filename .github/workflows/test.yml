name: Test

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test & Lint Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Check code formatting
        run: just fmt

      - name: Run clippy
        run: just clippy

      - name: Run workspace test suite
        run: just test

      - name: Run documentation tests
        run: just doc-test

      - name: Verify release build
        run: just release

      - name: Verify Git-derived binary version
        shell: bash
        run: |
          package_version="$(
            cargo metadata --no-deps --format-version 1 | python3 -c "
          import json, sys
          pkgs = json.load(sys.stdin)['packages']
          name = 'repin'
          print(next(p['version'] for p in pkgs if p['name'] == name))
          "
          )"
          commit="$(git rev-parse --short=12 HEAD)"
          expected="repin v${package_version}-${commit}"
          test "$(target/release/repin --version)" = "$expected"

  docs:
    name: Documentation Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Build and verify documentation
        run: just docs
